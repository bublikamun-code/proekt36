name: snapshots

# Пересъёмка визуальной базовой линии на linux: локально darwin-снимки переснимаются
# `--update-snapshots`, а linux-база живёт только здесь (D4). Запуск вручную, результат —
# артефакт с png; обновлённые файлы коммитятся вручную после осмотра глазами.
on:
  workflow_dispatch:

jobs:
  linux-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Пересъёмка визуальной базы
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots
        env:
          PLAYWRIGHT_CHROMIUM_DISABLE_SANDBOX: '1'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/e2e/visual.spec.ts-snapshots/
          retention-days: 14
