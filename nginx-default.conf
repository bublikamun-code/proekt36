# Panel36: static SPA behind nginx, no Node in the runtime image.
# The build already embeds the same CSP as a meta tag; the header variant is stronger
# (frame-ancestors/form-action) and works for every response including cached assets.
# nginx drops server-level add_header in locations that declare their own add_header,
# so the CSP header is repeated in each location that sets cache headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Mirrors the vite build CSP. The assistant goes through /ai below, so connect-src stays
  # same-origin: the policy never names a visitor's loopback, with or without the proxy.
  set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; frame-ancestors 'none'; form-action 'self'";

  # Optional assistant proxy: present only when the compose profile `ai` runs the ai-proxy
  # service. The upstream lives in a variable resolved per request — a static proxy_pass to a
  # missing service would refuse to start nginx at all, while this way the location answers
  # 502 and the app reports the assistant as unavailable: the designed degradation.
  location /ai/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ai_upstream ai-proxy:8787;
    rewrite ^/ai/(.*)$ /$1 break;
    proxy_pass http://$ai_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    # The chat answer can take the whole client timeout (130 s) to arrive.
    proxy_read_timeout 140s;
    client_max_body_size 512k;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp;
    try_files $uri =404;
  }

  location /models/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp;
  }

  # SPA history fallback: every route that is not a file serves index.html.
  location / {
    add_header Content-Security-Policy $csp;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    try_files $uri $uri/ /index.html;
  }
}
