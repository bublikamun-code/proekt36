# Panel36: static SPA behind nginx, no Node in the runtime image.
# The build already embeds the same CSP as a meta tag; the header variant is stronger
# (frame-ancestors/form-action) and works for every response including cached assets.
# nginx drops server-level add_header in locations that declare their own add_header,
# so the CSP header is repeated in each location that sets cache headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Mirrors the vite build CSP; connect-src also allows the local AI proxy port.
  set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:8787 http://localhost:8787 data: blob:; frame-ancestors 'none'; form-action 'self'";

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp;
    try_files $uri =404;
  }

  location /models/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp;
  }

  # SPA history fallback: every route that is not a file serves index.html.
  location / {
    add_header Content-Security-Policy $csp;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    try_files $uri $uri/ /index.html;
  }
}
